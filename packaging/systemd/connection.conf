[Unit]
Wants=network-online.target
After=network-online.target

[Service]
ExecStart=
RuntimeDirectory=kladit-agent
RuntimeDirectoryMode=0700
ExecStartPre=/usr/bin/install -m 0600 %d/agent-token /run/kladit-agent/token
ExecStart=/usr/local/lib/kladit-agent/kladit-agent send --config /etc/kladit-agent/connection.json --token-file /run/kladit-agent/token
LoadCredential=agent-token:/etc/kladit-agent/token
RestrictAddressFamilies=
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
IPAddressDeny=
