[Unit]
Wants=network-online.target
After=network-online.target

[Service]
ExecStart=
ExecStart=/usr/local/lib/kladit-agent/kladit-agent send --config /etc/kladit-agent/connection.json
LoadCredential=agent-token:/etc/kladit-agent/token
RestrictAddressFamilies=
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
IPAddressDeny=
