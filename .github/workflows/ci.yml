name: Agent CI
on:
  push:
    branches: ["**"]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go test -race ./...
      - run: for script in scripts/*.sh; do sh -n "$script"; done
      - run: sh scripts/package.sh "$RUNNER_TEMP/bundles" https://kladit.example/agent/0.2.0
      - run: sh scripts/check-package.sh "$RUNNER_TEMP/bundles" "$(go run ./cmd/kladit-agent version | cut -d ' ' -f 2)"
      - run: |
          mkdir "$RUNNER_TEMP/install-check"
          tar -xzf "$RUNNER_TEMP/bundles/kladit-agent-linux-amd64.tar.gz" -C "$RUNNER_TEMP/install-check"
          sudo sh "$RUNNER_TEMP/install-check/scripts/install.sh" --allow-metrics --enroll-url https://kladit.example/api/v1/agent/enroll --check
      - name: Install, remove and reinstall with a custom systemd override
        run: |
          bundle="$RUNNER_TEMP/install-check"
          for cycle in 1 2; do
            sudo sh "$bundle/scripts/install.sh" --allow-metrics
            test -x /usr/local/lib/kladit-agent/uninstall.sh
            sudo install -d /etc/systemd/system/kladit-agent.service.d
            printf '[Service]\nMemoryMax=96M\n' | sudo tee /etc/systemd/system/kladit-agent.service.d/override.conf > /dev/null
            sudo install -m 0600 /dev/null /etc/kladit-agent/token
            sudo sh /usr/local/lib/kladit-agent/uninstall.sh --confirm --purge
            test ! -e /usr/local/lib/kladit-agent
            test ! -e /etc/kladit-agent
            test ! -e /etc/systemd/system/kladit-agent.service
            test ! -e /etc/systemd/system/kladit-agent.timer
            grep -qx 'MemoryMax=96M' /etc/systemd/system/kladit-agent.service.d/override.conf
          done
          sudo rm /etc/systemd/system/kladit-agent.service.d/override.conf
          sudo rmdir /etc/systemd/system/kladit-agent.service.d
          sudo systemctl daemon-reload
      - uses: actions/upload-artifact@v4
        with:
          name: agent-bundle-test-only
          path: ${{ runner.temp }}/bundles
