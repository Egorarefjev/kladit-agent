name: Agent CI
on:
  push:
    branches: ["**"]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go test -race ./...
      - run: for script in scripts/*.sh; do sh -n "$script"; done
      - run: sh scripts/package.sh "$RUNNER_TEMP/bundles" https://kladit.example/agent/0.2.0
      - run: sh scripts/check-package.sh "$RUNNER_TEMP/bundles" "$(go run ./cmd/kladit-agent version | cut -d ' ' -f 2)"
      - run: |
          mkdir "$RUNNER_TEMP/install-check"
          tar -xzf "$RUNNER_TEMP/bundles/kladit-agent-linux-amd64.tar.gz" -C "$RUNNER_TEMP/install-check"
          sudo sh "$RUNNER_TEMP/install-check/scripts/install.sh" --allow-metrics --enroll-url https://kladit.example/api/v1/agent/enroll --check
      - name: Install, remove and reinstall with a custom systemd override
        run: |
          bundle="$RUNNER_TEMP/install-check"
          fixture=$(mktemp -d)
          ca=/run/kladit-agent-ci-ca.pem
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=127.0.0.1 \
            -addext subjectAltName=IP:127.0.0.1 -keyout "$fixture/key.pem" -out "$fixture/cert.pem"
          sudo install -m 0644 "$fixture/cert.pem" "$ca"
          cd "$fixture"
          python3 - <<'PY' &
          import json
          import ssl
          from http.server import BaseHTTPRequestHandler, HTTPServer
          from pathlib import Path

          class MetricsReceiver(BaseHTTPRequestHandler):
              def do_POST(self):
                  payload = json.loads(self.rfile.read(int(self.headers["Content-Length"])))
                  if (self.path == "/api/v1/agent/metrics"
                      and self.headers.get("Authorization") == "Bearer " + "a" * 43
                      and payload["version"] == 1
                      and payload["metrics"]["memory_total_bytes"] > 0
                      and payload["metrics"]["disk"]["total_bytes"] > 0
                      and payload["metrics"]["gpus"] == []):
                      Path("received").touch()
                      self.send_response(204)
                  else:
                      self.send_response(400)
                  self.end_headers()

          server = HTTPServer(("127.0.0.1", 0), MetricsReceiver)
          tls = ssl.SSLContext(ssl.PROTOCOL_TLS_SERVER)
          tls.load_cert_chain("cert.pem", "key.pem")
          server.socket = tls.wrap_socket(server.socket, server_side=True)
          Path("connection.json").write_text(json.dumps({
              "endpoint": f"https://127.0.0.1:{server.server_port}/api/v1/agent/metrics"
          }))
          server.serve_forever()
          PY
          receiver=$!
          trap 'kill "$receiver"; sudo rm -f "$ca"; rm -rf "$fixture"' EXIT
          for attempt in {1..50}; do
            if test -s connection.json; then break; fi
            sleep 0.1
          done
          test -s connection.json
          printf '%043d\n' 0 | tr 0 a > token
          sudo install -d /etc/systemd/system/kladit-agent.service.d
          printf '[Service]\nMemoryMax=96M\nEnvironment=SSL_CERT_FILE=%s\n' "$ca" |
            sudo tee /etc/systemd/system/kladit-agent.service.d/override.conf > /dev/null
          for cycle in 1 2; do
            rm -f received
            if ! sudo sh "$bundle/scripts/install.sh" --allow-metrics --config "$fixture/connection.json" --token-file "$fixture/token"; then
              sudo journalctl -u kladit-agent.service -n 20 --no-pager
              exit 1
            fi
            test -f received
            systemctl is-enabled kladit-agent.timer
            sudo systemctl stop kladit-agent.timer kladit-agent.service
            test ! -e /run/kladit-agent
            test -x /usr/local/lib/kladit-agent/uninstall.sh
            sudo sh /usr/local/lib/kladit-agent/uninstall.sh --confirm --purge
            test ! -e /usr/local/lib/kladit-agent
            test ! -e /etc/kladit-agent
            test ! -e /etc/systemd/system/kladit-agent.service
            test ! -e /etc/systemd/system/kladit-agent.timer
            grep -qx 'MemoryMax=96M' /etc/systemd/system/kladit-agent.service.d/override.conf
          done
          sudo rm /etc/systemd/system/kladit-agent.service.d/override.conf
          sudo rmdir /etc/systemd/system/kladit-agent.service.d
          sudo systemctl daemon-reload
      - uses: actions/upload-artifact@v4
        with:
          name: agent-bundle-test-only
          path: ${{ runner.temp }}/bundles
